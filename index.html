

 <!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>
</head>

<body>

    
    <h1>Annual Tech Fest 2026</h1>

    <h2>Event Schedule</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Time</th>
                <th>Activity</th>
                <th>Venue</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>9:00 AM-10.00AM</td>
                <td>Opening Ceremony</td>
                <td>Heera Hall</td>
            </tr>

            <tr>
                <td>10:00AM-5.00PM</td>
                <td>Coding Contest</td>
                <td>CCC Lab</td>
            </tr>
        
        

            <tr>
                <td>6:00 PM-7.00PM</td>
                <td>Closing Ceremony</td>
                <td>Heera Hall</td>
            </tr>


        
        </tbody>
    </table>

    <br><br>

    <!-- Registration Form -->
    <h2>Registration Form</h2>

    <form method="post" action="#">

        <!-- Text Input -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <!-- Email Input -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <!-- Date Input -->
        <label for="date">Event Date:</label><br>
        <input type="date" id="date" name="date"><br><br>

        <!-- Radio Buttons -->
        <input type="radio" id="student" name="ticket" value="student">
        <label for="student">student</label><br>
        
        <input type="radio" id="regular" name="ticket" value="regular">
        <label for="regular">regular</label><br>

        <input type="radio" id="vip" name="ticket" value="VIP">
        <label for="vip">VIP</label><br><br>

        <!-- Checkbox -->
        <label>Workshop Preference:</label><br>
       
        <input type="checkbox" id="html" name="workshop" value="HTML">
        <label for="html">HTML Basics</label><br>
        
        <input type="checkbox" id="Python" name="workshop" value-="Python">
        <label for="Python">Python for beginners</label><br>

        
        
        <input type="checkbox" id="cpp" name="workshop" value="C++">
        <label for="cpp">C++ programming</label><br><br>

        <!-- Textarea -->
        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="30"></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

    </form>

</body>
</html>
